    storySummary: "建立於 1917 年、巴拿馬精品咖啡歷史起點「蕾莉達莊園」頂級微氣候地塊紅玉谷。海拔 1,700 公尺冷涼氣候與百年水洗工藝，展現香柚、白葡萄果汁感與蔗糖茶韻。"
    story: |
      坐落於巴拿馬西部奇里基省（Chiriquí）波奎特產區、巴魯火山（Baru Volcano）迎風面的「蕾莉達莊園（Finca Lerida）」，是巴拿馬精品咖啡歷史的傳奇起點。莊園由挪威工程師 Tollef Bache Mönniche 於 1917 至 1922 年間建立，並於 1929 年成功向德國出口巴拿馬歷史上第一批精品咖啡豆。

      「紅玉谷（Ruby Ridge）」是蕾莉達莊園內部的頂級微氣候專屬地塊，坐落於海拔 1,700 公尺之巔，極致冷涼的氣候讓咖啡果實成熟極為緩慢。莊園結合百年傳承的精細水洗技術，將卡杜拉與卡杜艾品種做出了極致乾淨、富有高級茶感與果汁感的貴族風味，入口滿溢香柚、白葡萄與清甜櫻桃果香，餘韻如蔗糖水般甘甜清透。
