      山區終年雲霧繚繞、降雨豐沛，巨大的日夜溫差大幅拉長了咖啡櫻桃的成熟週期，讓衣索比亞古老原生種（Heirloom）在果肉中緩慢凝聚出極高密度的蔗糖與細緻酸質。

      透過精細挑選的全紅果日曬慢速乾燥工法，完美展現出如盛開白花、熟柑橘與黃肉李交織的明亮果香，並在口中化為甘醇的蜂蜜紅茶餘韻，是耶加雪菲日曬工藝的極致典範。
