    story: |
      自盧安達首都吉佳利（Kigali）啟程，前往其林比（Kilimbi）處理廠的路途，是一場視覺與感官的盛宴。約四小時的車程裡，生豆團隊穿梭於茂密的原始森林，越過盧安達標誌性的起伏群山，最終，非洲五大湖之一的基伍湖（Lake Kivu）豁然展現於眼前。

      湖泊西側與剛果共和國隔水相望，而其林比處理廠便靜謐地坐落於湖畔；令人驚嘆的是，此處許多鮮紅的咖啡漿果，竟是由當地小農划船橫跨湖面送達。其林比的微型氣候深受湖泊調節，劇烈的日夜溫差賦予了咖啡豆極高的密度。

      在生產商 Muraho 的深耕下，其林比成為盧安達首間獲得政府許可進行蜜處理與日曬加工的處理廠，奠定了其在精品咖啡界的傳奇地位。
