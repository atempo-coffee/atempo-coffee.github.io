    storySummary: "艾芮嘉處理廠（Aricha）隱身於耶加雪菲著名的迷霧山谷（Misty Valley），匯集周邊 650 至 750 位小農鮮果。強烈日夜溫差讓咖啡樹在夜裡保留更多糖分，造就細緻橙花與大吉嶺紅茶般的乾淨甜感。"
    story: |
      被眾多烘豆師視為經典的艾芮嘉（Aricha）處理廠，靜靜坐落於衣索比亞南部蓋德奧（Gedeo）地區耶加雪菲的核心微產區——迷霧山谷（Misty Valley）。佔地 2.5 公頃的處理廠由 Mr. Surafel Birhanu 細心經營，每個產季匯集周邊約 650 至 750 位咖啡小農悉心栽種的鮮紅櫻桃。

      這片海拔高聳、終年被山嵐環繞的森林地帶，遠望宛如一座浮現於霧海之上的青翠島嶼。白天陽光穿透薄霧，讓咖啡樹透過光合作用製造充足醣類；入夜後氣溫驟降、山谷寒意深沉，咖啡樹的呼吸作用隨之放緩，大幅減少了糖分的夜間消耗。

      正因這份日夜交替的溫差恩賜，結合從田間照護到水洗發酵一絲不苟的工藝，讓艾芮嘉村的水洗豆展現出如透明玻璃般純粹的乾淨度。磨開時是清雅的橙花與橘色水果香氣，入口則化作橘子、白柚與檸檬交織大吉嶺紅茶、蜂蜜的柔順甘甜，恰如冬日晨霧裡第一道溫暖微光。
