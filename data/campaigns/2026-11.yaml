    story: |
      緊鄰耶加雪菲東南方、隸屬於衣索比亞歐羅米亞州（Oromia）的谷吉產區（Guji），在 2002 年正式建立獨立產區識別後，罕貝拉瓦米娜鎮（Hambela Wamena）便憑藉極高海拔與眾多國際競賽常勝微產區的實力，站上了精品咖啡的頂峰。

      名為「高原之生」的這支批次，出自 2026 年 TOH（Taste of Harvest）大賽得獎處理廠，只收錄來自海拔 2,400 至 2,600 公尺極高地帶的小農果實。當地多為五公頃以下的庭園式農園，咖啡樹在富含鐵質的紅褐色火山土壤中與原生遮蔭樹、糧食作物共生，依循近乎有機的自然農法緩慢生長；寒冷的高山均溫與巨大溫差拉長了成熟週期，讓細緻果酸與飽滿糖分在極高密度的豆芯裡悄悄濃縮。

      每年十月至隔年一月採收季間，農民僅手摘完全熟透的紅櫻桃，送往非洲式高架床慢速日曬 10 至 14 天，期間反覆以人工細膩翻動、剔除瑕疵。成豆沖煮後口感如糖漿般醇厚滑順，紅心芭樂、芒果與黑莓的奔放果甜在口中層層展開，尾韻更遺留巧克力、蜂蜜與綿長紅糖的冬日暖意。
    suitable:
