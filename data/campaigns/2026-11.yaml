    quote: "「百年家族實驗名莊的奶油可可協奏｜愉悅莊園乾式發酵 Ethiosar」"
    storySummary: "來自 1908 年紮根尼加拉瓜的 Mierisch 百年名門「愉悅莊園」，2021 年同莊園 Ethiosar 曾於私人競標賽奪冠。透過不加水的 36 小時開放式磁磚槽乾式發酵水洗，兼具水洗乾淨度與熟橘子、金莎巧克力般的奶油厚實甜感。"
    story: |
      來自德國的 Mierisch（米耶瑞詡）家族自 1908 年紮根尼加拉瓜，世代在馬塔加爾帕（Matagalpa）與欣奎加（Jinotega）的高海拔火山雲霧間悉心耕耘。其中位於馬塔加爾帕的「愉悅莊園」（Finca Los Placeres），更是家族實驗新世代農法與後製工藝的基地——園內刻意縮短株距、拉大行距以創造更佳的日照與空氣對流，並栽種原生草本植物 Brachiaria 滋養土壤有機質，同時嚴守水源五公尺內零化學藥劑的永續承諾。

      這支批次採用的是極具前瞻性的複合品種 ETHIOSAR——為了對抗氣候變遷與咖啡葉銹病，結合衣索比亞（Rume Sudan）高雅花果基因與中美洲品種「三重雜交」育成。2021 年，愉悅莊園的 Ethiosar 更曾在 Los Favoritos 私人競標拍賣會上拿下 90.30 分佳績，成為全場唯一突破 90 分的冠軍批次。

      後製上則大膽結合無水發酵的濃郁甜感與水洗的純淨度：櫻桃去皮後不額外注水，直接將帶果膠的生豆放入開放式磁磚發酵槽，進行長達 36 小時的「乾式發酵」，讓天然微生物在濃縮環境中緩慢轉化出豐富酯類香氣。焙至淺中焙後，既有熟橘子與帶核水果的柔和平衡，更展現如烤榛果、金莎巧克力與奶油般厚實圓潤的質地，伴隨綿長紅糖尾韻，格外適合微涼季節細品。
    suitable:
      - "喜歡中南美洲咖啡「厚實奶油觸感與榛果可可香氣」，同時期待些許優雅果酸層次的人。"
      - "對「36 小時無水乾式發酵」工藝及稀有三重雜交品種 Ethiosar 感興趣的風味玩家。"
      - "冬季微涼早晨想來一杯質感圓潤、如金莎巧克力與烤榛果般溫暖療癒手沖或拿鐵的你。"
