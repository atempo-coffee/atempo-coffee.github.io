    quote: "「基伍湖畔的傳奇紅果｜盧安達其林比日曬紅波旁 A1」"
    storySummary: "坐落於非洲五大湖之一基伍湖畔的其林比處理廠，微氣候深受湖泊調節，許多鮮紅咖啡漿果更由當地小農划船橫跨湖面送達，成就極高密度與賽事級甜巧克力尾韻。"
    story: |
      自盧安達首都吉佳利（Kigali）啟程，前往其林比（Kilimbi）處理廠的路途，本身就是一場穿越風景的感官序曲。約四小時的車程裡，團隊穿梭於茂密的原始森林與起伏綿延的「千丘之國」群山，直到非洲五大湖之一的基伍湖（Lake Kivu）豁然鋪展在眼前。

      湖泊西側與剛果共和國隔水相望，而其林比處理廠便靜謐地守在湖畔。令人驚嘆的是，這裡許多色澤飽滿的鮮紅咖啡漿果，竟是由當地小農划著木船橫越湖面親自送達。深受湖泊調節的微型氣候與劇烈日夜溫差，緩緩淬鍊出盧安達紅波旁（Red Bourbon）極高的豆質密度。

      在生產商 Muraho 的長年深耕下，其林比成為盧安達首間獲政府許可進行蜜處理與日曬工藝的處理廠。這支日曬 A1 批次將紅波旁的醇厚與湖畔風土凝結在一杯之中——既有熱帶水果與檸檬紅茶般的透亮果香，也在中後段轉為黑糖、甜腰果與絲滑巧克力的溫潤餘韻。
    suitable:
