    story: |
      創立於 1842 年的美帝娜莊園（Finca Medina），在瓜地馬拉安提瓜（Antigua）山谷走過超過一百八十年的歲月。莊園靜謐地被阿瓜（Agua）、富埃戈（Fuego）與阿卡特南戈（Acatenango）三座火山環抱；火山歷代噴發留下的浮石與火山灰土壤富含礦物質，既擁有極佳排水性，也能在乾季為根系鎖住珍貴水分；加上海拔 1,500 至 1,800 公尺的顯著日夜溫差，讓咖啡果實一步步緩慢熟成、積蓄極高密度。

      這座百年老莊園依然守著阿拉比卡最古老的原生變種之一——純血波旁（Bourbon）。儘管產量與抗病力都不及現代雜交品種，但這份執著只為了一個理由：安提瓜火山沃土孕育出的波旁豆粒圓潤飽滿，天生就帶著無可取代的細膩甜感與焦糖尾韻。

      然而這一次，美帝娜莊園打破了安提瓜咖啡多以水洗呈現的傳統，勇敢挑戰風險最高、工序最繁複的「黑蜜處理」：採收剝皮後刻意保留 80% 至 100% 最厚實的果膠層，不經水洗發酵槽，直接送往日曬棚架慢速乾燥兩至三週。當火山底蘊遇上黑蜜波旁，一磨開便撲來熟透波羅蜜與芒果的熱帶芬芳；入口綻放百香果、紅葡萄與櫻桃的明亮多汁，隨著杯溫緩緩下降，中後段化作黑糖、太妃糖、可可與淡雅煙燻伯爵茶交織的糖漿般滑順，為整場冬日選豆畫下濃郁迷人的句點。
